<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="NAIB — Public Intelligence Director for the Verve N Veda ecosystem.">
  <meta name="naib-core-ref" content="artist1970/CORE/NAIBCore">
  <meta name="naib-governance-steward" content="Noema">
  <meta name="naib-runtime-bridge" content="artist1970/noema-ai.github.io">
  <title>NAIB — Public Intelligence Director</title>

  <style>
    :root{
      color-scheme:dark;
      --bg:#07101a;
      --panel:#0f1926;
      --line:rgba(255,255,255,.13);
      --ink:#eef4f8;
      --muted:#9eabb8;
      --gold:#d8ba78;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink)}
    body{font-family:Arial,Helvetica,sans-serif;overflow:hidden}
    .bridge-shell{height:100%;display:grid;grid-template-rows:auto 1fr}
    .bridge-bar{
      min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:8px 14px;background:#08111b;border-bottom:1px solid var(--line)
    }
    .identity{display:flex;align-items:center;gap:10px;min-width:0}
    .mark{
      width:27px;height:27px;border:1px solid var(--gold);border-radius:50%;
      display:grid;place-items:center;font-family:Georgia,serif;color:var(--gold)
    }
    .identity strong{font-family:Georgia,serif;font-weight:400;letter-spacing:.12em}
    .identity span,.state{font-size:10px;color:var(--muted)}
    .state{text-align:right}
    iframe{display:block;width:100%;height:100%;border:0;background:#08111b}
    .noscript{padding:2rem;max-width:760px;margin:auto;line-height:1.6}
    @media(max-width:650px){
      .bridge-bar{min-height:38px}
      .identity span,.state{display:none}
    }
  </style>
</head>
<body>
  <div class="bridge-shell">
    <header class="bridge-bar" aria-label="NAIB public bridge">
      <div class="identity">
        <span class="mark" aria-hidden="true">N</span>
        <div>
          <strong>NAIB</strong>
          <span> · Public Intelligence Director</span>
        </div>
      </div>
      <div class="state">CORE governed · Noema runtime bridge · human final authority</div>
    </header>

    <iframe
      id="naibRuntime"
      title="NAIB public intelligence workspace"
      src="https://artist1970.github.io/noema-ai.github.io/"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="microphone"
    ></iframe>
  </div>

  <noscript>
    <div class="noscript">
      NAIB requires JavaScript for the interactive workspace.
      The canonical public runtime is currently bridged through the existing Noema implementation
      while NAIB's public front is separated safely from its private CORE.
    </div>
  </noscript>

  <script>
    /*
      NAIB PUBLIC BRIDGE CONTRACT

      IMPORTANT:
      - coreRef is a canonical governance reference only.
      - This public browser does NOT fetch the private CORE repository.
      - The working runtime remains in Noema during migration.
      - Do not place credentials, private keys, MFA secrets, or protected CORE data here.
    */
    window.NAIB_PUBLIC_BRIDGE = Object.freeze({
      version: "1.0.0",
      identity: Object.freeze({
        id: "naib",
        name: "NAIB",
        title: "Public Intelligence Director",
        role: "front-facing intelligence"
      }),
      core: Object.freeze({
        repository: "artist1970/CORE",
        path: "NAIBCore",
        canonicalRef: "artist1970/CORE/NAIBCore",
        access: "private",
        browserFetchAllowed: false
      }),
      governance: Object.freeze({
        steward: "Noema",
        humanFinalAuthority: true,
        permissionSelfElevation: false
      }),
      runtime: Object.freeze({
        repository: "artist1970/noema-ai.github.io",
        publicUrl: "https://artist1970.github.io/noema-ai.github.io/",
        mode: "compatibility-bridge"
      })
    });
  </script>
</body>
</html>
